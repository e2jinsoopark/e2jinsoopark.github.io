<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 모듈 테스트 하네스</title>
  <link rel="stylesheet" href="../../css/viewer.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, "Malgun Gothic", sans-serif; background: #f6f7f9; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ddd; background: #fff; font-size: 13px; }
    header output { color: #555; }
    #viewer { flex: 1; min-height: 0; }
    .dbg-box { position: absolute; box-sizing: border-box; pointer-events: none; z-index: 6; border: 1px solid; }
  </style>
</head>
<body>
  <header>
    <input type="file" id="file" accept="application/pdf">
    <button type="button" id="zoom-out">축소</button>
    <button type="button" id="zoom-in">확대</button>
    <button type="button" id="fit">폭 맞춤</button>
    <output id="status">PDF 파일을 선택하세요</output>
  </header>
  <div id="viewer"></div>
  <script type="module" src="./harness.mjs"></script>
</body>
</html>
